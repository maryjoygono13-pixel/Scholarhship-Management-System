<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login Form   </title>


</head>
<style>
   
@import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

    body{
        background-image:   linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5)),url('IMAGE/cm2.jpg');
        background-repeat: no-repeat;
        background-size: cover;
        margin:0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "DM sans",sans-serif ;
        
    }
    
          
    .box {
        width: 300px;
        height: 400px;
        border: 2px solid black;
        border-radius: 10px;
        background-color:rgb(255, 255, 255);
        padding: 20px;
        text-align:center;
        box-shadow: 0 0 10px rgba(0,0,0,0.2);
        color:gray;
        
    }
    .logo-image {
        width:100px;
       
    }
        
    .form-box h1{
        font-size:32px;
        color:black;
        
    }
    .input-group{
        position:relative;
        display:flex;
       
    }
    .form-box{
        display: flex;
        flex-direction:column;
        gap:10px;
     
    }
    .input-field{
    width:100%;
    height:40px;
    padding:0 14px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
    box-sizing:border-box;
}

.floating-label{
    position:absolute;
    top:50%;
    left:12px;
    transform:translateY(-50%);
    background:white;
    color:gray;
    padding:0 5px;
    transition:.3s;
    pointer-events:none;
}

.input-field:focus ~ .floating-label,
.input-field:not(:placeholder-shown) ~ .floating-label{
    top:0;
    font-size:12px;
    color:gray;
}

.input-field:focus{
    border-color:gray;
}

.input-field:not(:focus):not(:placeholder-shown) ~ .floating-label{
    color:gray;
}
.eye-icon{
    position:absolute;
    right:15px;
    display: flex;
    top: 50%;
    transform: translateY(-50%);
}
.eye-icon svg{
    width: 20px;
    height:20px;
    cursor: pointer;
    color:gray;
}
.form-btn {
    display: flex;
    justify-content: center;
    align-items:center;
    gap:10px;
    height: 48px;
    background:none;
    border-radius:6px;
    cursor:pointer;
    padding-inline:8px;  
}
.form-btn--submit{
    background-color: rgb(76, 129, 104);
    color: white;
    font-size:16px;
    font-weight: 600;
    margin-top:20px;
    transition:background-color.3s ease;
    outline:auto;

}
.form-btn--submit:hover{
    background-color:#53ac5a;
}


      

        
</style>
<body>
    
   <div class="box">
    <div class="form-box">
      <div class="logo">
        <img src="IMAGE/cmlogo.jpg"cmlogo" class="logo-image"> 
      </div>
    <div class="form-header">
        <h1>SCHOLAR PORTAL</H1>
            <p> Sign in to continue</p>
    </div>
    
     <form class="form-box">
        <div class="input-group">
            <input type="email" id="email" class="input-field" placeholder=""required>
       <label for="email" class="floating-label">Email address</label>
       </div>
        <div class="input-group">
            <input type="password" id="password" class="input-field" placeholder=""required>
       <label for="password" class="floating-label">Password</label>
       <div class="eye-icon" onclick="togglePassword()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye-icon lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
       </div>
    </div>
     <button type="submit" class="form-btn form-btn--submit   ">  Sign in </button>
        </div>
    </form>

    </div>
   </div>
  
    
    <script>
function togglePassword() {
    const passwordInput = document.getElementById("password");
    const eyeIcon = document.querySelector(".eye-icon");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";

        eyeIcon.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
            <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
            <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
            <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
            <path d="m2 2 20 20"/>
        </svg>`;
    } else {
        passwordInput.type = "password";

        eyeIcon.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
        viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round"
        stroke-linejoin="round">
            <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>`;
    }
}
</script>
    </script>   

    

    
   
</body>



</html
